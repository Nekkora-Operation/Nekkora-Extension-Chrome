<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Nekkora Inspector</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="panel.css">
  <script src="../shared/tokens.js"></script>
</head>
<body>
  <header>
    <div class="brand"><span class="mark" aria-hidden="true">N</span> NEKKORA INSPECTOR</div>
    <span id="mode-badge" class="badge mode" hidden></span>
  </header>

  <section class="control" aria-label="Inspeção">
    <dl class="kv status-kv">
      <dt>Host Java</dt><dd id="host-status" class="status" role="status">verificando…</dd>
    </dl>
    <button id="btn-inspect" class="primary inspect-toggle" type="button" aria-pressed="false" data-state="INACTIVE">Ativar inspeção</button>
    <dl class="kv status-kv" id="capture-status" aria-live="polite">
      <dt>Captura</dt><dd id="st-capture">Inativa</dd>
      <dt>Elementos</dt><dd id="st-nodes">—</dd>
      <dt>Última atualização</dt><dd id="st-updated">—</dd>
      <dt>Deltas</dt><dd id="st-deltas">—</dd>
    </dl>
  </section>

  <p id="message" class="message" role="alert" hidden></p>

  <section id="dev-tools" class="toolbar dev" aria-label="Ferramentas de desenvolvimento" hidden>
    <span class="dev-label">DEV</span>
    <button id="btn-resolve" type="button">Testar reencontro</button>
    <button id="btn-compare" type="button">Comparar snapshots</button>
    <button id="btn-export" type="button">Exportar mapa</button>
    <button id="btn-capture" type="button">Forçar captura completa</button>
  </section>

  <section aria-labelledby="h-element">
    <h2 id="h-element">Elemento</h2>
    <dl id="element-info" class="kv"><dt>Seleção</dt><dd>ative a inspeção e clique em um elemento</dd></dl>
  </section>

  <section aria-labelledby="h-family">
    <h2 id="h-family">Família</h2>
    <dl id="family-info" class="kv"></dl>
  </section>

  <section aria-labelledby="h-locators">
    <h2 id="h-locators">Localizadores</h2>
    <table id="locators">
      <thead><tr><th>Estratégia</th><th>Seletor</th><th title="Correspondências no snapshot">Snap</th><th title="Correspondências na DOM real (CSS/XPath)">Real</th><th>Estabilidade</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="dev-output" aria-labelledby="h-resolution" hidden>
    <h2 id="h-resolution">Reencontro / Comparação</h2>
    <pre id="resolution" class="mono"></pre>
  </section>

  <script type="module" src="panel.js"></script>
</body>
</html>
