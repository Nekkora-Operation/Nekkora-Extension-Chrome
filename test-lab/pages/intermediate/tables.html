<!doctype html>
<html lang="pt-BR">

<body>

      <tr data-client="101"><td>Ana</td><td>Ativo</td><td><button>Editar</button> <button>Excluir</button></td></tr>

  </table>
  <h2>Pedidos</h2>

    <thead><tr><th>Número</th><th>Cliente</th><th>Total</th><th>Ações</th></tr></thead>

      <tr><th scope="row">PED-0001</th><td>Ana</td><td>R$ 120,00</td><td><button>Editar</button></td></tr>

  <script src="/lab/lab.js"></script>

</html>
