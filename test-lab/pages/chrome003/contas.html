<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Contas</title>
  <style>body{font:14px system-ui;margin:8px} input,button{font:inherit}</style>
</head>
<body>
  <h3>Contas</h3>
  <form id="form-conta" aria-label="Nova conta" onsubmit="event.preventDefault()">
    <label for="valor">Valor</label> <input id="valor" name="valor">
    <label for="vencimento">Vencimento</label> <input id="vencimento" name="vencimento" type="date">
    <button type="submit">Salvar</button>
  </form>
</body>
</html>
