<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Widget simulado</title>
  <style>body{font:12px system-ui;margin:6px;background:#f6f6f6} .sim{border:1px dashed #999;padding:6px}</style>
</head>
<body>
  <!-- Conteúdo LOCAL que ocupa o lugar do widget de um fornecedor. Não há serviço real, chave real ou tráfego externo. -->
  <div class="sim"><input type="checkbox" id="caixa" aria-label="Caixa de verificação simulada"> Widget simulado do laboratório</div>
</body>
</html>
