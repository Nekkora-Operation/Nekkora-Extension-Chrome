<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>LAB-P09 — proteção dinâmica</title>
  <link rel="stylesheet" href="/lab/lab.css">
</head>
<body>
  <nav class="lab"><a href="/lab/index.html">← laboratório</a></nav>
  <p class="sim-banner">Fixture SIMULADA — o widget surge após uma ação e depois desaparece (sem indicar conclusão).</p>
  <h1>Comentários</h1>
  <label for="comentario">Comentário</label> <textarea id="comentario" name="comentario"></textarea>
  <button type="button" id="exibir">Exibir verificação</button>
  <button type="button" id="ocultar">Remover verificação</button>
  <div id="area-verificacao"></div>
  <script src="/lab/lab.js"></script>
  <script>
    document.getElementById('exibir').onclick = () => {
      const s = document.createElement('script');
      s.type = 'application/x-nekkora-inert'; // inerte: não é buscado nem executado
      s.src = 'https://js.hcaptcha.com/1/api.js';
      s.id = 'hc-script';
      document.head.appendChild(s);
      document.getElementById('area-verificacao').innerHTML =
        '<div class="h-captcha" data-sitekey="LAB-FICTICIA-0009" style="width:300px;height:70px;border:1px dashed #999">hCaptcha simulado</div>';
    };
    document.getElementById('ocultar').onclick = () => {
      document.getElementById('area-verificacao').replaceChildren();
      const s = document.getElementById('hc-script');
      if (s) s.remove();
    };
  </script>
</body>
</html>
