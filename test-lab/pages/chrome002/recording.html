<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Gravação simulada</title>
  <link rel="stylesheet" href="/lab/lab.css">
</head>
<body>
  <nav class="lab"><a href="/lab/index.html">← laboratório</a></nav>
  <h1>Gravação simulada</h1>
  <p class="muted">A página NÃO controla a gravação: os eventos <code>recording.session.started</code>, <code>finished</code> e
    <code>cancelled</code> são emitidos pelo harness interno da extensão (simulação do contrato da plataforma).</p>
  <form id="form-cadastro" onsubmit="event.preventDefault()">
    <label for="nome">Nome</label><input id="nome" name="nome">
    <label for="cidade">Cidade</label><input id="cidade" name="cidade">
    <label for="senha-cad">Senha</label><input id="senha-cad" name="senha" type="password">
    <button type="submit" id="salvar">Salvar cadastro</button>
  </form>
  <button type="button" id="adicionar-linha">Adicionar linha</button>
  <table id="historico"><thead><tr><th>Evento</th><th>Ação</th></tr></thead><tbody></tbody></table>
  <script src="/lab/lab.js"></script>
  <script>
    let n = 0;
    document.getElementById('adicionar-linha').onclick = () => {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>Evento ' + (++n) + '</td><td><button type="button">Detalhar ' + n + '</button></td>';
      document.querySelector('#historico tbody').appendChild(tr);
    };
  </script>
</body>
</html>
