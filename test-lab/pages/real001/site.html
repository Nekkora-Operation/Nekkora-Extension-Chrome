    // Iframes de outra origem: site-b (autorizado na homologação) e site-x (nunca autorizado). A porta é a da página.

      ['anuncio', 'Parceiro sem autorização', 'site-x.nekkora.test', '/lab/real001/partner.html'],

      const f = document.createElement('iframe');
      f.id = id;
      f.title = title;
      f.src = 'http://' + host + ':' + port + path;
      document.getElementById('frames').append(f);

    // Navegação SPA: rota por pushState, sem recarga. (Com a inspeção ativa, cliques viram SELEÇÃO — a extensão não
    // executa ações da página —, então a homologação aciona as mesmas funções diretamente.)
    window.irPara = (rota) => {
      const a = document.querySelector('[data-route="' + rota + '"]');
      history.pushState({}, '', a.getAttribute('href') + '&ref=REF-SECRETO-111');
      document.getElementById('rota').textContent = 'Rota: ' + rota;
    };
    for (const a of document.querySelectorAll('[data-route]')) {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        window.irPara(a.dataset.route);
      });
    }
    // Atualização dinâmica
    let n = 102;
    window.adicionarPedido = () => {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>A-' + n + '</td><td>Novo</td><td><button type="button">Ver A-' + n + '</button></td>';
      document.querySelector('#pedidos tbody').append(tr);
      n++;
    };
    document.getElementById('adicionar').addEventListener('click', window.adicionarPedido);
